name: High-q self-consistent spectral intake preflight
on:
  pull_request:
    paths:
      - "verification/q_high_continuation/**"
      - ".github/workflows/high-q-physical-intake.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publication-nodes-and-fail-closed-high-q:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install scientific dependencies
        run: python -m pip install -r requirements.txt
      - name: Published q0.10 spectrum and missing high-q hard-denial tests
        run: python -m unittest discover -s verification/q_high_continuation/tests -p 'test_*.py' -v
      - name: Read and audit actual archived 80-shell q0.10 spectral nodes
        run: python verification/q_high_continuation/run_new_q.py --selftest-q010
      - name: Assert impossible high-q without physical input fails closed
        run: |
          set +e
          python verification/q_high_continuation/run_new_q.py \
            --manifest /tmp/MISSING_physical_q030_manifest.json \
            --validate-only > high-q-missing.log 2>&1
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            echo "ERROR: high-q continuation falsely accepted missing physical input"
            exit 1
          fi
          grep -q "FileNotFoundError" high-q-missing.log || grep -q "No such file or directory" high-q-missing.log
          echo "Q_HIGH_MISSING_REAL_EINSTEIN_VLASOV_INPUT_FAIL_CLOSED_PASS"
