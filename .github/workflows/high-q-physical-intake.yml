name: High-q self-consistent spectral intake preflight
on:
  pull_request:
    paths:
      - "verification/q_high_continuation/**"
      - ".github/workflows/high-q-physical-intake.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publication-nodes-and-fail-closed-high-q:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install scientific dependencies
        run: python -m pip install -r requirements.txt
      - name: Published q0.10 spectrum and missing high-q hard-denial tests
        run: python -m unittest discover -s verification/q_high_continuation/tests -p 'test_*.py' -v
      - name: Audit frozen high-resolution q0.30 Taylor data provenance
        run: |
          python verification/q_high_continuation/audit_q030_taylor.py
      - name: Read and audit actual archived 80-shell q0.10 spectral nodes
        run: python verification/q_high_continuation/run_new_q.py --selftest-q010
      - name: Assert impossible high-q without physical input fails closed
        run: |
          set +e
          python verification/q_high_continuation/run_new_q.py \
            --manifest /tmp/MISSING_physical_q030_manifest.json \
            --validate-only > high-q-missing.log 2>&1
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            echo "ERROR: high-q continuation falsely accepted missing physical input"
            exit 1
          fi
          grep -q "FileNotFoundError" high-q-missing.log || grep -q "No such file or directory" high-q-missing.log
          echo "Q_HIGH_MISSING_REAL_EINSTEIN_VLASOV_INPUT_FAIL_CLOSED_PASS"

  bounded-q030-global-diagnostic:
    needs: publication-nodes-and-fail-closed-high-q
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install scientific dependencies
        run: python -m pip install -r requirements.txt
      - name: Evaluate fixed three-source 7x4 smooth global candidates
        run: |
          python verification/q_high_continuation/q030_global_bounded_candidate.py \
            --output results/q030_global_local
      - name: Frozen q030 retarded-sheet argument-principle numerical audit
        run: |
          python verification/q_high_continuation/q030_global_winding_diagnostic.py \
            --output results/q030_global_local/q030_winding.json
      - name: Record results without implying a physical q030 QNM
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path=Path("results/q030_global_local/q030_global_comparison.json")
          if path.is_file():
              j=json.loads(path.read_text())
              assert j["physical_retarded_sheet_uniquely_selected"] is False
              assert j["physical_q030_QNM_confirmed"] is False
              assert j["gravitational_residue_computed"] is False
              assert j["astrophysical_detector_signal_computed"] is False
              print("Q030_EXPLORATORY_NOT_AN_ASTROPHYSICAL_DETECTION")
          else:
              print("Q030_GLOBAL_COMPARISON_NOT_COMPLETED_OR_FAILED: check job logs")
          PY
      - name: Preserve candidate and negative-result audit artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: q030-exploratory-global-three-sheets
          path: results/q030_global_local/
          if-no-files-found: warn
          retention-days: 90

  bounded-q025-global-diagnostic:
    needs: publication-nodes-and-fail-closed-high-q
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install scientific dependencies
        run: python -m pip install -r requirements.txt
      - name: Compare bounded q025 candidate roots on 641 and 801 spectra
        run: |
          python verification/q_high_continuation/q025_global_bounded_candidate.py \
            --output results/q025_global_local
      - name: Independent predeclared q025 net-winding diagnostics
        run: |
          python verification/q_high_continuation/q025_global_winding_diagnostic.py \
            --output results/q025_global_local/q025_winding.json
      - name: Guard against unsupported interpretation of preliminary q025 results
        if: always()
        run: |
          python - <<'PY'
          import json,pathlib
          p=pathlib.Path("results/q025_global_local/q025_global_comparison.json")
          if p.is_file():
              j=json.loads(p.read_text())
              assert j["physical_retarded_sheet_uniquely_selected"] is False
              assert j["physical_q025_QNM_confirmed"] is False
              assert j["gravitational_residue_computed"] is False
              print("Q025_PRELIMINARY_NUMERICAL_ONLY",j["status"])
          else:
              print("Q025_GLOBAL_RESULT_INCOMPLETE_CHECK_LOGS")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: q025-three-source-global-candidate-audit
          path: results/q025_global_local/
          retention-days: 90
          if-no-files-found: warn
