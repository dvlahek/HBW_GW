name: q-to-one vacuum endpoint and source residue audit
on:
  pull_request:
    paths:
      - "verification/q_to_one_endpoint/**"
      - ".github/workflows/q-to-one-endpoint.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  vacuum-endpoint-and-residues:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install numerical dependencies
        run: python -m pip install -r requirements.txt
      - name: Input provenance and exact transfer identity tests
        run: python -m unittest discover -s verification/q_to_one_endpoint/tests -p 'test_*.py' -v
      - name: Numerically compute q=1 vacuum determinant and matter-root contour
        run: |
          python verification/q_to_one_endpoint/q_to_one_endpoint_audit.py \
            --output verification/q_to_one_endpoint/ci_results \
            --contour-n 32 \
            --Rmax 80
      - name: Independent analytic full-state Wronskian q1 vacuum contour
        run: |
          python verification/q_to_one_endpoint/analytic_full_state_vacuum.py \
            --output verification/q_to_one_endpoint/ci_results
      - name: No synthetic finite-q >.20 pole or residue values allowed
        run: |
          python - <<'PY'
          import json,glob,pathlib
          path=pathlib.Path("verification/q_to_one_endpoint/ci_results/q_to_one_endpoint_audit.json")
          assert path.is_file()
          j=json.loads(path.read_text())
          assert j["last_published_finite_q"]==.2
          assert j["q1_transfer"]["T_equals_identity_exactly"] is True
          assert j["q1_transfer"]["thickness_M"]==0
          assert j["q1_matter_pole_disk"]["winding_number"]==0
          assert j["q1_matter_pole_disk_independent_resolution_check"]["winding_number"]==0
          assert j["q1_matter_pole_disk_independent_resolution_check"]["N"]==64
          assert len(j["published_q_family"])==5
          assert len(j["unresolved_mass_ratios"])==7
          assert all(x["pole_status"]=="NOT COMPUTED" for x in j["unresolved_mass_ratios"])
          assert all(x["residue_status"]=="NOT COMPUTED" for x in j["unresolved_mass_ratios"])
          assert j["published_exterior_source_residue_ratios"]["smooth"]["q0p1"]["source_count"]==3
          W=json.loads(pathlib.Path("verification/q_to_one_endpoint/ci_results/q1_analytic_full_state_zero_count.json").read_text())
          assert W["no_detector_strain_used"] is True
          assert W["new_finite_q_between_0p2_and_1_pole_computed"] is False
          assert len(W["analytic_contours"])==2
          assert all(c["analytic_full_state_W_winding"]==0 for c in W["analytic_contours"])
          assert W["full_state_q1_normalized_det_abs_at_matter"]>.05
          assert W["full_state_q1_normalized_det_abs_at_vacuum"]<1e-6
          print("Q1_FULL_STATE_ANALYTIC_CONTOUR_PASS")
          print("Q_TO_ONE_SOURCE_PROVENANCE_AND_NO_EXTRAPOLATION_PASS")
          PY
      - name: Archive endpoint audit not fabricated continuation
        uses: actions/upload-artifact@v4
        with:
          name: q-to-one-endpoint-audit
          path: verification/q_to_one_endpoint/ci_results/
          retention-days: 90
