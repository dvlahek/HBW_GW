name: CQG upper-half-plane audit

# Verification-only workflow for the CQG-117441 revision audit.
on:
  push:
    branches:
      - main
      - revision/upper-half-plane-audit-20261103
    paths:
      - 'verification/blind_multiple_shooting/**'
      - '.github/workflows/upper-half-plane-audit.yml'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Verify publication spectral input
        working-directory: verification/blind_multiple_shooting
        run: python verify_spectral_input.py

      - name: Run physical-sheet full-window audit with physical-root fallback
        working-directory: verification/blind_multiple_shooting
        run: |
          python - <<'PY'
          import sys
          import upper_half_plane_audit as u
          u.ANCHOR_RE = 0.4
          u.FALLBACKS = u.FALLBACKS + ((0.0 + 0.0j, -0.22 + 0.0j),)
          sys.argv = [
              'upper_half_plane_audit.py',
              '--n-primary', '384',
              '--n-dense', '768',
              '--re-min', '-0.05',
              '--re-max', '1.0',
              '--im-min', '0.001',
              '--im-max', '0.5',
              '--rmax', '40',
          ]
          u.main()
          PY

      - name: Show summary
        if: always()
        working-directory: verification/blind_multiple_shooting
        run: cat upper_half_plane_audit_output/upper_half_plane_audit_summary.txt || true

      - name: Upload audit outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cqg-upper-half-plane-audit-final
          path: verification/blind_multiple_shooting/upper_half_plane_audit_output/
          if-no-files-found: warn
